name: CI

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: RTL testbenches
        run: make sim
      - name: Bug repro testbench
        run: make sim-repro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-logs
          path: build/*.log

  isa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/riscv-tests, pinned
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc-riscv64-unknown-elf
      - name: rv32ui + rv32um + rv32ua compliance
        run: make isa
      - name: Demo programs on the 4-core SoC (UART output checked)
        run: |
          make soc-run PROG=hello && make soc-run PROG=parsum
          make soc-run PROG=atomics && make soc-run PROG=prodcons && make soc-run PROG=litmus
          make soc-run PROG=memstress && make soc-run PROG=selfmod && make soc-run PROG=ldorder
      - name: Constrained-random coherence test (3 seeds)
        run: make coh-random
      - name: Coherence test must catch seven injected bugs
        run: make coh-mutants
      - name: Core tests must catch two LSQ ordering bugs
        run: make core-mutants
      - name: System test through the board wrapper (UART decoded from the pin; FPGA itself on hold)
        run: make fpga-sim PROG=hello && make fpga-sim PROG=parsum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isa-summary
          path: build/isa/summary.txt

  noc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/riscv-tests, pinned
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc-riscv64-unknown-elf python3
      - name: Demo programs on the NoC + directory build
        run: |
          make soc-run NOC=1 PROG=hello && make soc-run NOC=1 PROG=atomics
          make soc-run NOC=1 PROG=litmus && make soc-run NOC=1 PROG=ldorder
      - name: Constrained-random coherence test, one home and four homes
        run: make coh-random NOC=1 && make coh-random NOC=1 NOC_BANKS=4
      - name: Coherence test must catch nine injected bugs (NoC)
        run: make coh-mutants NOC=1
      - name: Functional coverage, bus and NoC (fails on an illegal event)
        run: make coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: build/coverage.txt

  synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Verilator
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Verilator lint
        run: make lint
      - name: Generic synthesis
        run: make synth
      - name: Formal proof of the bus arbiter
        run: make formal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synth-log
          path: build/synth.log

  ubuntu-2204:
    # The stock Ubuntu 22.04 tools (Icarus 11, GCC 10.2, Yosys 0.9). Verilator 5
    # is built by scripts/setup_ubuntu.sh there; not repeated here (slow).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/riscv-tests, pinned
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc-riscv64-unknown-elf yosys python3-matplotlib
      - name: RTL testbenches and ISA tests
        run: make sim && make isa
      - name: Demo programs, bus and NoC
        run: make soc-run PROG=hello && make soc-run PROG=litmus && make soc-run NOC=1 PROG=atomics
      - name: Constrained-random coherence test
        run: make coh-random
      - name: Formal proof and synthesis
        run: make formal && make synth
      - name: Presentation charts
        run: make visuals
