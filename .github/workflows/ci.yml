name: CI

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: RTL testbenches
        run: make sim
      - name: Bug repro testbench
        run: make sim-repro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-logs
          path: build/*.log

  isa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/riscv-tests, pinned
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc-riscv64-unknown-elf
      - name: rv32ui + rv32um + rv32ua compliance
        run: make isa
      - name: Demo programs on the 4-core SoC (UART output checked)
        run: |
          make soc-run PROG=hello && make soc-run PROG=parsum
          make soc-run PROG=atomics && make soc-run PROG=prodcons && make soc-run PROG=litmus
          make soc-run PROG=memstress && make soc-run PROG=selfmod
      - name: Constrained-random coherence test (3 seeds)
        run: make coh-random
      - name: Coherence test must catch six injected bugs
        run: make coh-mutants
      - name: Board-level simulation of the FPGA top (UART decoded from the pin)
        run: make fpga-sim PROG=hello && make fpga-sim PROG=parsum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isa-summary
          path: build/isa/summary.txt

  synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Verilator
        run: sudo apt-get update && sudo apt-get install -y yosys verilator
      - name: Verilator lint
        run: make lint
      - name: Generic synthesis
        run: make synth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synth-log
          path: build/synth.log
